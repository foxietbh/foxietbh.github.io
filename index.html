<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <div class="topbar">
      <a>goncalosfckd</a>
    </div>

    <div class="main">
      <div class="box" id="menuBox">
        <div class="title" id="menuBoxHeader">
          <p class="title">Menu</p>
          <button onclick="removeElmnt('menuBox')">X</button>
          <button>?</button>
        </div>
        <div class="body">
          <menu>
            <li>
              <a href="/pages/thoughts/thoughts.html" class="no-style-link"

            </li>
            <li>

            <li>
              <span
                class="clickable-text"

      <div class="box" id="catbox">

    <script src="./script.js"></script>
    <script type="module">
      import { startChat } from "../pages/chat/server.js";

      document.getElementById("chatLine").addEventListener("click", () => {
