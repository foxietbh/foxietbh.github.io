<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <div class="topbar">
      <a>goncalosfckd</a>
    </div>

    <div class="main">
      <div class="box" id="menuBox">
        <div class="title" id="menuBoxHeader">
          <p class="title">Menu</p>
          <button onclick="removeElmnt('menuBox')">X</button>
          <button>?</button>
        </div>
        <div class="body">
          <menu>
            <li>
              <span class="clickable-text" id="thoughtsBtn">Thoughts</span>
            </li>
            <li>
              <span class="clickable-text" id="galleryBtn">Gallery</span>
            </li>
            <li>
              <span class="clickable-text" id="chatBtn">Chat</span>
            </li>
            <li>
              <span class="clickable-text" id="linksBtn">Links & Socials</span>
            </li>
          </menu>
        </div>
      </div>

      <div class="box" id="catbox">
        <div class="title" id="catboxHeader">
          <p class="title">About</p>
          <button onclick="removeElmnt('catbox')">X</button>
          <button>?</button>
        </div>
        <div class="body">
          <img
            id="headphone-cat2"
            src="src/headphonecat.jpg"
            alt="Headphone Cat"
          />
        </div>
      </div>

      <!-- CHATBOX-->

      <!-- LOGIN FORM -->
      <div id="loginDiv" style="display: none" class="box">
        <div class="title">
          <p class="title">Login / Register</p>
          <button onclick="closeLogin()">X</button>
          <button>?</button>
        </div>
        <div class="body">
          <input id="nickInput" placeholder="Nickname" /><br />
          <input id="passInput" type="password" placeholder="Password" /><br />

          <div class="body-buttons">
            <button id="loginBtn">Login</button>
            <button id="registerBtn">Register</button>
          </div>
        </div>
      </div>

      <!-- CHAT CONTAINER -->
      <div id="chatContainer" style="display: none" class="box">
        <div class="title">
          <p class="title">Chat</p>
          <button onclick="closeChat()">X</button>
          <button>?</button>
        </div>
        <div class="body">
          <div
            id="chat"
            style="border: 1px solid #000; height: 200px; overflow-y: scroll"
          ></div>
          <input id="msg" placeholder="Type a message..." />
          <button id="send">Send</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { startChat } from "../pages/chat/server.js";

      // Open login when clicking "Chat"
      document.getElementById("chatBtn").addEventListener("click", () => {
        document.getElementById("loginDiv").style.display = "block";
      });

      // Close functions
      window.closeLogin = () => {
        document.getElementById("loginDiv").style.display = "none";
        flipStatus('chat');
      };
      window.closeChat = () => {
        document.getElementById("chatContainer").style.display = "none";
        flipStatus('chat');
      };

      // Start chat module
      startChat();
    </script>

    <!-- AUDIO PLAYER -->

    <div id="audioPlayer">
      <div class="header">
        <span>Tunes</span>
        <button
          onclick="document.getElementById('audioPlayer').style.display='none'"
        >
          ×
        </button>
      </div>

      <div class="body">
        <div class="track-display">
          <div class="scrolling-text" id="trackTitle">Loading...</div>
        </div>

        <div class="controls">
          <button onclick="prevTrack()" title="Previous">⏮</button>
          <button onclick="togglePlay()" id="playBtn" title="Play/Pause">
            ▶
          </button>
          <button onclick="stopTrack()" title="Stop">⏹</button>
          <button onclick="nextTrack()" title="Next">⏭</button>
        </div>

        <div class="slider-container">
          <div class="slider-row">
            <span class="slider-label">SEEK</span>
            <input
              type="range"
              id="seek"
              min="0"
              max="100"
              step="0.1"
              value="0"
            />
          </div>
          <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
          </div>

          <div class="slider-row">
            <span class="slider-label">VOL</span>
            <input
              type="range"
              id="volume"
              min="0"
              max="100"
              step="1"
              value="20"
            />
            <span class="volume-indicator" id="volumeDisplay">20%</span>
          </div>
        </div>

        <div class="panel-toggles">
          <button
            class="panel-toggle"
            onclick="togglePlaylist()"
            id="playlistBtn"
          >
            UP NEXT
          </button>
          <button
            class="panel-toggle"
            onclick="toggleEqualizer()"
            id="equalizerBtn"
          >
            EQ
          </button>
        </div>
      </div>

      <!-- Playlist Panel -->
      <div class="playlist" id="playlist"></div>

      <!-- Equalizer Panel -->
      <div class="eq-panel" id="eqPanel">
        <div class="eq-bars" id="equalizer">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
        </div>
      </div>
    </div>

    <audio id="audio"></audio>

    <script src="./pages/player/player.js"></script>
    <script type="module" src="./script.js"></script>
  </body>
</html>
